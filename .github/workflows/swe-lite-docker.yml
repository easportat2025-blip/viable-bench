name: swe-lite-docker
on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "git URL of target repo (pure-python)"
        required: true
        default: "https://github.com/pytest-dev/pytest.git"
      commit:
        description: "base commit SHA"
        required: true
        default: ""
      patch_url:
        description: "raw URL of .diff to apply (empty = smoke, no patch)"
        required: false
        default: ""
      tests:
        description: "pytest node path(s) to run"
        required: true
        default: "testing/test_assertion_rewrite.py -q"
      run_id:
        description: "label for this scoring run"
        required: true
        default: "smoke-001"
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: bench
      - name: clone target
        run: |
          if [ "${{ inputs.target_repo }}" = "SELF" ]; then
            mkdir -p work && cp -r bench/harness/selftest/* work/ && ls work
          else
            git clone "${{ inputs.target_repo }}" work
            cd work
            git checkout "${{ inputs.commit }}"
            git log --oneline -1
          fi
      - name: fetch patch
        if: inputs.patch_url != ''
        run: |
          curl -sL "${{ inputs.patch_url }}" -o work/model.diff
          wc -c work/model.diff
      - name: eval in docker
        run: |
          cd work
          PATCH_ARG=""
          APPLY_STATUS="no-patch"
          if [ -f model.diff ]; then
            if git apply --check model.diff; then git apply model.diff; APPLY_STATUS="applied";
            else APPLY_STATUS="rejected"; fi
          fi
          echo "$APPLY_STATUS" > apply.status
          cat > run_tests.sh <<'SCRIPT_EOF'
          pip install -q pytest
          python -m pytest "$@" --junitxml=/work/junit.xml -q 2>&1 | tee /work/pytest.log
          echo "EXIT_CODE=${PIPESTATUS[0]}" > /work/pytest.env
          SCRIPT_EOF
          docker run --rm -v "$PWD:/work" -w /work python:3.12-slim bash /work/run_tests.sh ${{ inputs.tests }}
          cat pytest.env
          tail -n 25 pytest.log || true
      - name: score
        run: |
          python bench/harness/score_junit.py work/junit.xml --run-id "${{ inputs.run_id }}" --apply-status "$(cat work/apply.status)" --out "score-${{ inputs.run_id }}.json"
          cat "score-${{ inputs.run_id }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: score-${{ inputs.run_id }}
          path: score-${{ inputs.run_id }}.json
